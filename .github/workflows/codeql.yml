name: CodeQL

# Advanced setup. Do not also enable "Default setup" under Settings → Code security:
# the two would upload competing analyses.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new queries run against code that has not changed.
    - cron: "23 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload results to the Security tab
      packages: read # fetch CodeQL packs
      actions: read # read workflow run info
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app: TypeScript, React and the build/test scripts.
          - language: javascript-typescript
            build-mode: none
          # The workflows in .github/workflows.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
