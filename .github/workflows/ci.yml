name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repository. Without this block the
# GITHUB_TOKEN gets the repository default, which can include write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
